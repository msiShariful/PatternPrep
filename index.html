<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PatternPrep — FAANG interviews by pattern, not by grind</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231a73e8'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3E%7B%7D%3C/text%3E%3C/svg%3E">
<script>
/* Resolve theme before first paint to avoid a flash of the wrong mode. */
(function () {
  var t;
  try { t = localStorage.getItem("patternprep.theme"); } catch (e) {}
  if (t !== "dark" && t !== "light") {
    t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Roboto:wght@400;500;700&family=Google+Sans+Code:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <button class="icon-btn hamburger" id="navToggle" aria-label="Open navigation" aria-expanded="false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="#/">
    <span class="brand-mark">{&hairsp;}</span>
    <span class="brand-name">Pattern<b>Prep</b></span>
  </a>
  <nav class="tabs" id="tabs" aria-label="Sections"><!-- app.js --></nav>
  <div class="topbar-right">
    <a class="progress-pill" href="#/" id="progressPill" title="Overall progress"><!-- app.js --></a>
    <button class="icon-btn" id="themeToggle" aria-label="Switch color theme">
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
    <div class="menu">
      <button class="icon-btn" id="menuBtn" aria-label="Progress data menu" aria-haspopup="true" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
      <div class="menu-list" id="menuList" hidden>
        <button id="exportBtn">Export progress (JSON)</button>
        <button id="importBtn">Import progress</button>
        <hr>
        <button id="resetBtn" class="danger">Reset all progress</button>
      </div>
    </div>
  </div>
</header>

<nav class="drawer" id="drawer" aria-label="Navigation drawer"><div id="drawerNav"></div></nav>
<div class="scrim" id="scrim"></div>

<main class="main" id="view" tabindex="-1"><!-- routed views --></main>

<footer class="foot">
  Progress is saved in this browser only (localStorage) — clearing site data resets it.
  Use <b>⋮ → Export</b> to keep a backup you can restore anywhere.
</footer>

<input type="file" id="importFile" accept="application/json" hidden>
